name: Flutter Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      windows_repeats:
        description: 'Run the Windows test this many times (flake hunting)'
        default: '1'

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=linux .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  windows:
    name: Windows Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=windows .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      # Windows keeps no record of a crashed flutter_tester unless asked:
      # register a WER LocalDumps minidump for it (the runner is admin).
      - name: Enable crash dumps for flutter_tester
        shell: pwsh
        run: |
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          # The runner image may have Windows Error Reporting switched off,
          # which also suppresses the Application-log crash events.
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          "WER before: " + ((Get-ItemProperty $wer -ErrorAction SilentlyContinue | Select-Object Disabled, DontShowUI | Format-List | Out-String).Trim())
          Set-ItemProperty -Path $wer -Name Disabled -Value 0 -Type DWord
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord
          Set-Service WerSvc -StartupType Manual -ErrorAction SilentlyContinue
          Get-Service WerSvc | Format-Table Name, Status, StartType
          foreach ($exe in 'flutter_tester.exe', 'dart.exe') {
            $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name DumpFolder -Value $dumps -Type ExpandString
            Set-ItemProperty -Path $k -Name DumpType -Value 2 -Type DWord
            Set-ItemProperty -Path $k -Name DumpCount -Value 10 -Type DWord
          }
          "DUMP_DIR=$dumps" >> $env:GITHUB_ENV

      - name: Run tests
        working-directory: flutter_example
        shell: pwsh
        run: |
          $repeats = [int]('${{ github.event.inputs.windows_repeats || 1 }}')
          if ($repeats -le 1) {
            flutter test test/library_test.dart
            exit $LASTEXITCODE
          }
          # Flake hunting: verbose output per run (it is the only place
          # flutter_tools reports the tester's exit code on Windows), kept
          # for the failed runs and uploaded with the crash dumps.
          $failed = 0
          for ($i = 1; $i -le $repeats; $i++) {
            "===== run $i of $repeats ====="
            $log = "$env:DUMP_DIR\run_$i.log"
            flutter test -v test/library_test.dart 2>&1 | Out-File -FilePath $log -Encoding utf8
            $code = $LASTEXITCODE
            Get-Content $log | Select-String -Pattern 'tests passed|exited with code|Shell subprocess|Shell:|exception|Exception|crash' | ForEach-Object { $_.Line }
            if ($code -ne 0) { $failed++; "===== run $i FAILED (exit $code) =====" } else { Remove-Item $log }
          }
          if ($failed -gt 0) { "$failed of $repeats runs failed"; exit 1 }

      - name: Crash dumps and the native library
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem $env:DUMP_DIR -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          $dll = Get-ChildItem -Recurse -Filter open62541.dll flutter_example\.dart_tool, .dart_tool -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName $env:DUMP_DIR; "copied $($dll.FullName)" }

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-flutter-crash-dumps
          path: ${{ env.DUMP_DIR }}
          if-no-files-found: ignore

      # On Windows flutter_tools discards flutter_tester's exit code
      # (flutter_tester_device.dart, `finished`: "On Windows, the [exitCode]
      # and the terminating signal have no correlation"), so a tester that
      # dies mid-run is indistinguishable from one that finished: the test
      # channel just closes, package:test marks the running test and every
      # test after it complete without a result (the github reporter still
      # prints them with a ✅), the summary counts only the tests that really
      # finished ("🎉 4 tests passed." under seven ✅ lines) and the step exits
      # 1 with no ❌ anywhere. Only Windows itself records the crash: print
      # the Application-log entries (exception code, faulting module and
      # offset) so the next occurrence can be attributed.
      - name: Crash records for flutter_tester (Windows Application log)
        if: failure()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddHours(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'flutter_tester|dart' }
          if (-not $events) { "No Application-log crash record for flutter_tester/dart in the last 2 hours."; exit 0 }
          foreach ($e in $events) { "--- $($e.TimeCreated) event $($e.Id)"; $e.Message }

  macos:
    name: macOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=macos .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  android:
    name: Android Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          working-directory: flutter_example
          script: flutter test integration_test/library_test.dart --timeout 20m

  ios:
    name: iOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=ios .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          # Wait for simulator to be fully booted
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run integration tests
        working-directory: flutter_example
        run: |
          # Check simulator status
          xcrun simctl list devices booted
          # Run with verbose to see where it gets stuck
          flutter test integration_test/library_test.dart -d $DEVICE_ID --verbose 2>&1 | tee test_output.txt || true
          # Show last 100 lines if it fails
          tail -100 test_output.txt
          # Check for crash logs
          find ~/Library/Logs/DiagnosticReports -name "*.crash" -mmin -10 2>/dev/null | head -5 || true
