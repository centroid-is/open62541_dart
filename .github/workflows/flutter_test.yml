name: Flutter Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      windows_repeats:
        description: 'Run the Windows test this many times (flake hunting)'
        default: '1'

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=linux .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  windows:
    name: Windows Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # beta, not stable: `flutter test` starts flutter_tester with
      # --enable-dart-profiling, and the Dart VM's native stack walker in
      # Dart <= 3.13 can read a not-yet-committed stack page while the sampled
      # thread is in __chkstk entering an open62541 function with a large
      # frame; the access violation kills the tester silently and the run
      # ends as "every test ✅, 🎉 4 tests passed., exit 1"
      # (flutter/flutter#191069). Fixed in Dart 0a7701121e, shipped in
      # Dart 3.14 (Flutter beta 3.49+); go back to stable once it carries
      # Dart 3.14.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=windows .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Dump directory for flake hunting
        shell: pwsh
        run: |
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          "DUMP_DIR=$dumps" >> $env:GITHUB_ENV

      - name: Run tests
        working-directory: flutter_example
        shell: pwsh
        run: |
          $repeats = [int]('${{ github.event.inputs.windows_repeats || 1 }}')
          if ($repeats -le 1) {
            flutter test test/library_test.dart
            exit $LASTEXITCODE
          }
          # Flake hunting: verbose output per run (it is the only place
          # flutter_tools reports the tester's exit code on Windows), kept
          # for the failed runs and uploaded with the crash dumps.
          # flutter_tools discards flutter_tester's exit code on Windows and
          # the Dart VM handles the access violation itself (no WER dump, no
          # event-log record), so attach ProcDump to each flutter_tester and
          # take a full dump on the first-chance access violation. This is
          # how the crash behind flutter/flutter#191069 was caught here.
          $pd = "$env:RUNNER_TEMP\procdump"
          New-Item -ItemType Directory -Force $pd | Out-Null
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Procdump.zip -OutFile "$pd\Procdump.zip"
          Expand-Archive "$pd\Procdump.zip" -DestinationPath $pd -Force
          $procdump = "$pd\procdump64.exe"
          $failed = 0
          for ($i = 1; $i -le $repeats; $i++) {
            "===== run $i of $repeats ====="
            $log = "$env:DUMP_DIR\run_$i.log"
            $job = Start-Job -ScriptBlock {
              param($dir, $log)
              Set-Location $dir
              & flutter test -v test/library_test.dart 2>&1 | Out-File -FilePath $log -Encoding utf8
              $LASTEXITCODE
            } -ArgumentList (Get-Location).Path, $log
            $tester = $null
            for ($w = 0; $w -lt 600 -and -not $tester; $w++) {
              Start-Sleep -Milliseconds 100
              $tester = Get-Process flutter_tester -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($job.State -ne 'Running') { break }
            }
            if ($tester) {
              & $procdump -accepteula -ma -e 1 -f C0000005 $tester.Id "$env:DUMP_DIR\run_${i}_PROCESSNAME_PID.dmp" 2>&1 |
                Select-String -Pattern 'Dump|Exception|exception' | ForEach-Object { $_.Line }
            } else { "no flutter_tester process seen" }
            $code = Receive-Job -Job $job -Wait -AutoRemoveJob | Select-Object -Last 1
            Get-Content $log | Select-String -Pattern 'tests passed|exited with code|Shell subprocess|Shell:|exception|Exception|crash' | ForEach-Object { $_.Line }
            if ($code -ne 0) { $failed++; "===== run $i FAILED (exit $code) =====" } else { Remove-Item $log -ErrorAction SilentlyContinue }
          }
          if ($failed -gt 0) { "$failed of $repeats runs failed"; exit 1 }

      - name: Crash dumps and the native library
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem $env:DUMP_DIR -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          $dll = Get-ChildItem -Recurse -Filter open62541.dll flutter_example\.dart_tool, .dart_tool -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName $env:DUMP_DIR; "copied $($dll.FullName)" }

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-flutter-crash-dumps
          path: ${{ env.DUMP_DIR }}
          if-no-files-found: ignore

  macos:
    name: macOS Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=macos .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  android:
    name: Android Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          working-directory: flutter_example
          script: flutter test integration_test/library_test.dart --timeout 20m

  ios:
    name: iOS Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=ios .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          # Wait for simulator to be fully booted
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run integration tests
        working-directory: flutter_example
        run: |
          # Check simulator status
          xcrun simctl list devices booted
          # Run with verbose to see where it gets stuck
          flutter test integration_test/library_test.dart -d $DEVICE_ID --verbose 2>&1 | tee test_output.txt || true
          # Show last 100 lines if it fails
          tail -100 test_output.txt
          # Check for crash logs
          find ~/Library/Logs/DiagnosticReports -name "*.crash" -mmin -10 2>/dev/null | head -5 || true
