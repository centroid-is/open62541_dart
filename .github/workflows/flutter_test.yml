name: Flutter Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=linux .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  windows:
    name: Windows Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=windows .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  macos:
    name: macOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=macos .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_example
        run: flutter test test/library_test.dart

  android:
    name: Android Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          working-directory: flutter_example
          script: flutter test integration_test/library_test.dart --timeout 20m

  ios:
    name: iOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        working-directory: flutter_example
        run: flutter create --platforms=ios .

      - name: Get dependencies
        working-directory: flutter_example
        run: flutter pub get

      - name: Install coreutils
        run: brew install coreutils

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          for attempt in 1 2 3; do
            echo "Boot attempt $attempt of 3 for simulator: $DEVICE_ID"
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl boot "$DEVICE_ID" || true
            if gtimeout 120 xcrun simctl bootstatus "$DEVICE_ID" -b; then
              echo "Simulator booted successfully"
              echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
              exit 0
            fi
            echo "Boot timed out, retrying..."
          done
          echo "Failed to boot simulator after 3 attempts"
          exit 1

      - name: Run integration tests
        working-directory: flutter_example
        timeout-minutes: 20
        run: flutter test integration_test/library_test.dart -d $DEVICE_ID
