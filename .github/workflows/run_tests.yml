name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart format --set-exit-if-changed . # Line length is set in analysis_options.yaml

      - name: Verify import order
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart pub run import_sorter:main --exit-if-changed

      - name: Analyze project source
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart analyze --fatal-infos --fatal-warnings .


      - name: Install dependencies for open62541 library Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt install libmbedtls-dev

      - name: Install dependencies for open62541 library macOS
        if: matrix.os == 'macos-latest'
        run: brew install mbedtls

      - name: Install dependencies for open62541 library windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install openssl

      - name: Build open62541 library
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: ./open62541_tooling/build_lib.sh

      - name: Build open62541 library windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -B build -S open62541 -DBUILD_SHARED_LIBS=ON -DUA_ENABLE_INLINABLE_EXPORT=ON -DUA_ENABLE_ENCRYPTION=OPENSSL
          cmake --build build -j 4 --config RelWithDebInfo
          cp build/bin/RelWithDebInfo/open62541.dll lib/libopen62541.dll

      - name: Run tests
        run: dart test