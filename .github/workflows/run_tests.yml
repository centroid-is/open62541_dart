name: Run Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart format --set-exit-if-changed . # Line length is set in analysis_options.yaml

      - name: Verify import order
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart pub run import_sorter:main --exit-if-changed

      - name: Analyze project source
        if: matrix.os == 'ubuntu-latest' # Only run on Linux, dont need all the runners to run this
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Check outdated dependencies
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: dart pub outdated

      - name: Run tests
        run: dart test

  # The pure-Dart barrel (open62541_types.dart) must keep compiling without
  # dart:ffi. The VM lane cannot tell: a stray FFI import compiles fine there.
  # `dart test -p chrome` compiles test/web with dart2js and runs it in the
  # runner's Chrome, which also exercises the build hook's no-code-assets path.
  test-web:
    name: test-web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: dart pub get

      - name: Run browser tests
        run: dart test -p chrome test/web

  test-sanitizer:
    name: test-asan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: dart pub get

      # The hooks runner scrubs the environment, so the switch is a file in the
      # package root (see hook/build.dart).
      - name: Build the library with ASan + UBSan
        run: |
          touch .open62541_sanitizer
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
          ASAN_OPTIONS="detect_leaks=0,halt_on_error=1" \
          dart test test/native_sanitizer_test.dart

      - name: Assert the library is sanitised
        run: |
          LIB=.dart_tool/lib/libopen62541.so
          nm -D "$LIB" | grep -q '__asan_' || { echo "::error::$LIB has no __asan_ symbols; the lane is not sanitising"; exit 1; }

      - name: Run tests with AddressSanitizer
        run: |
          # Find the ASAN shared library for LD_PRELOAD
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          echo "Using ASAN library: $ASAN_LIB"
          LD_PRELOAD="$ASAN_LIB" \
          ASAN_OPTIONS="detect_leaks=0,halt_on_error=1,print_stats_on_exit=1" \
          dart test
