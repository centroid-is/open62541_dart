name: open62541
description: >-
  Dart FFI bindings to the open62541 OPC UA stack. Provides client and server
  APIs for OPC UA over TCP, with subscriptions, custom types and mbedTLS encryption.
version: 1.5.7+3
repository: https://github.com/centroid-is/open62541_dart
homepage: https://github.com/centroid-is/open62541_dart
issue_tracker: https://github.com/centroid-is/open62541_dart/issues

environment:
  # Native build hooks (hook/build.dart) are stable only from Dart 3.10.
  sdk: ^3.10.0
dependencies:
  archive: ^4.2.0
  binarize: ^2.0.0
  # The build hook is compatible with code_assets 1.x and 2.x. Resolution
  # currently lands on 1.x because native_toolchain_c (via
  # native_toolchain_cmake) and ffigen have not yet migrated to code_assets
  # 2.0.0's breaking Architecture/OS equality change; pub will pick 2.x
  # automatically once they do.
  code_assets: ">=1.0.0 <3.0.0"
  collection: ^1.19.0
  crypto: ^3.0.0
  ffi: ^2.1.2
  hooks: ">=1.0.0 <3.0.0"
  http: ^1.6.0
  logging: ^1.3.0
  native_toolchain_cmake: ^0.3.2
  tuple: ^2.0.2
platforms:
  linux:
  windows:
  macos:
  android:
  ios:
topics:
  - network
  - industrial
  - opcua
  - open62541
  - hmi
dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  test: ^1.31.2
  import_sorter: ^4.6.0
import_sorter:
  emojis: false
  comments: false
  ignored_files: 
    - open62541.g.dart
