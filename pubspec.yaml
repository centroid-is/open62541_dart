name: open62541
description: >-
  Dart FFI bindings to the open62541 OPC UA stack. Provides client and server
  APIs for OPC UA over TCP, with subscriptions, custom types and mbedTLS encryption.
version: 1.5.7
repository: https://github.com/centroid-is/open62541_dart
homepage: https://github.com/centroid-is/open62541_dart
issue_tracker: https://github.com/centroid-is/open62541_dart/issues

environment:
  # Native build hooks (hook/build.dart) are stable only from Dart 3.10.
  sdk: ^3.10.0
dependencies:
  archive: ^4.0.7
  binarize: ^2.0.0
  code_assets: ^1.0.0
  collection: ^1.19.0
  ffi: ^2.1.2
  hooks: ">=1.0.0 <3.0.0"
  http: ^1.6.0
  logging: ^1.3.0
  native_toolchain_cmake: ^0.3.0
  tuple: ^2.0.2
platforms:
  linux:
  windows:
  macos:
  android:
  ios:
topics:
  - network
  - industrial
  - opcua
  - open62541
  - hmi
dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  test: ^1.24.0
  import_sorter: ^4.6.0
import_sorter:
  emojis: false
  comments: false
  ignored_files: 
    - open62541.g.dart